<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Slawa Mironow</title>
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="bg-white text-slate-900 antialiased">

  <main class="w-full max-w-[600px] mx-auto min-h-[200px] mt-12 sm:mt-[100px] px-6 sm:px-1 flex flex-col md:flex-row items-center md:items-start justify-between gap-8 md:gap-0">
    
    <!-- Linke Spalte: Name, GitHub, Beschreibung & Kontakt -->
    <div class="flex flex-col justify-between self-stretch pt-[15px] pb-0 md:pb-[40px] text-center md:text-left">
      <div>
        <h1 class="leading-none m-0">
          <span class="text-[#777777] text-[32px] sm:text-[40px] tracking-[0.1em]">Slawa</span>
          <span class="text-[#8F0000] text-[32px] sm:text-[40px] tracking-[0.1em]">Mironow</span>
        </h1>

        <div class="flex items-center justify-center md:justify-start gap-2 mt-2">
          <a href="https://github.com/cyberpioneer" class="no-underline inline-flex items-center" title="github.com" target="_blank" rel="noopener noreferrer">
            <img src="github_icon.jpg" alt="GitHub" class="h-4 block">
          </a>
          <span class="text-[#777777] text-[14px] sm:text-[16px] tracking-[0.2em]">Web Development &amp; Co.</span>
        </div>
      </div>

      <!-- Kontaktadresse (auf Desktop unten ausgerichtet) -->
      <div class="mt-6 md:mt-12">
        <span class="text-[#777777] text-[14px] tracking-[0.2em]">slawa.mironow@gmail.com</span>
      </div>
    </div>

    <!-- Rechte Spalte: Device Bild -->
    <div class="shrink-0 flex justify-center md:justify-end -mt-4">
      <img src="thinkpad.png" alt="ThinkPad" class="w-[208px] h-auto block">
    </div>

  </main>

</body>
</html>
